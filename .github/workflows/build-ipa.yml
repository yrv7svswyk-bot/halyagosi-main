name: Build Halyagosi IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build IPA
        run: |
          # megkeresi hol van a pubspec.yaml (a dupla mappa miatt)
          if [ -f "halyagosi-main/pubspec.yaml" ]; then cd halyagosi-main; fi
          if [ -f "pubspec.yaml" ]; then echo "rootban van"; fi
          # ha duplán van egymásba ágyazva
          if [ -f "halyagosi-main/halyagosi-main/pubspec.yaml" ]; then cd halyagosi-main/halyagosi-main; fi
          flutter pub get
          flutter build ios --no-codesign --release
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Halyagosi.ipa
          ls -lh Halyagosi.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Halyagosi-IPA
          path: "**/Halyagosi.ipa"
